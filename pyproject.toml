[project]
name = "otcybersecurity-assistant"
version = "0.1.0"
description = "RAG conversational assistant for OT/ICS cybersecurity (IEC 62443)"
requires-python = ">=3.14"
authors = [{ name = "OT Cybersecurity Assistant Team" }]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "chromadb>=1.0",
    "httpx>=0.28",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "langchain>=0.3",
    "langchain-chroma>=0.2",
    "langchain-community>=0.3",
    "pyjwt>=2.10",
    "slowapi>=0.1",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
managed = true

[tool.uv.pip]
python = "3.14"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
