[project]
name = "otcybersecurity-assistant"
version = "0.1.0"
description = "RAG conversational assistant for OT/ICS cybersecurity (IEC 62443)"
requires-python = ">=3.14"
authors = [{ name = "OT Cybersecurity Assistant Team" }]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "chromadb==1.5.9",
    "httpx==0.28.1",
    "pymupdf==1.28.0",
    "python-dotenv==1.2.2",
    "loguru==0.7.3",
    "langchain==1.3.14",
    "langchain-chroma==1.1.0",
    "langchain-community==0.4.2",
    "pyjwt==2.13.0",
    "slowapi==0.1.10",
    "prometheus-client==0.26.0",
    "langchain-openai==1.4.1",
    "pypdf==6.14.2",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
managed = true

[tool.uv.pip]
python = "3.14"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
